# Title shown in Application Information tab.
title: "OCI OKE Infrastructure as Code"
# Sub Title shown in Application Information tab.
description: "OCI OKE Infrastructure as Code – Reference Implementation"
stackDescription: |
  Terraform-based reference implementation to provision a complete Kubernetes
  environment on Oracle Cloud Infrastructure (OCI) using Oracle Kubernetes Engine (OKE).

  Supports all four networking scenarios from the official Oracle documentation:

    Example 1 — Flannel CNI, Public API Endpoint
    Example 2 — Flannel CNI, Private API Endpoint
    Example 3 — OCI VCN-Native CNI, Public API Endpoint
    Example 4 — OCI VCN-Native CNI, Private API Endpoint

informationalText: |
  This stack implements the official networking guidance from Oracle Documentation:
  https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengnetworkconfigexample.htm

  Select the CNI Plugin and API Endpoint exposure to match your desired scenario.

schemaVersion: 1.1.0
version: "2026.03.28"
locale: "en"

# =============================================================================
# Variable Groups — controls form layout in ORM Console
# =============================================================================

variableGroups:

  - title: "General Configuration"
    variables:
      - region
      - compartment_id
      - ad_name
      - cluster_name
      - kubernetes_version

  - title: "Cluster Architecture"
    description: "Choose the CNI plugin and API endpoint exposure to match one of the four reference scenarios from Oracle documentation."
    variables:
      - type_of_cluster
      - cni_type
      - is_api_endpoint_public

  - title: "Network Configuration"
    variables:
      - vcn_cidr_block_16
      - subnet_lb_cidr_24
      - subnet_api_endpoint_cidr
      - subnet_nodes_cidr_24
      - subnet_pods_cidr_19

  - title: "Node Pool Configuration"
    variables:
      - pool_size
      - pool_node_shape
      - ocpus
      - memory_in_gbs
      - pool_node_image_id

# =============================================================================
# Variable Definitions
# =============================================================================

variables:

  # ---------------------------------------------------------------------------
  # General Configuration
  # ---------------------------------------------------------------------------

  region:
    type: enum
    title: "OCI Region"
    description: "Region where resources will be deployed"
    required: true
    default: "sa-saopaulo-1"
    enum:
      - sa-saopaulo-1
      - sa-vinhedo-1

  compartment_id:
    type: oci:identity:compartment:id
    title: "Compartment OCID"
    description: "The OCID of the compartment where resources will be created"
    required: true

  ad_name:
    type: oci:identity:availabilitydomain:name
    title: "Availability Domain"
    description: "Availability Domain where the worker nodes will be deployed"
    dependsOn:
      compartmentId: compartment_id
      region: region
    required: true

  cluster_name:
    type: string
    title: "OKE Cluster Name"
    description: "Display name of the Kubernetes cluster"
    required: true

  kubernetes_version:
    type: string
    title: "Kubernetes Version"
    description: "The Kubernetes version used for the OKE control plane and worker nodes"
    dependsOn:
      compartmentId: compartment_id
      region: region
    default: "v1.34.2"

  # ---------------------------------------------------------------------------
  # Cluster Architecture
  # ---------------------------------------------------------------------------

  type_of_cluster:
    type: enum
    title: "Cluster Type"
    description: "Type of OKE cluster"
    default: "ENHANCED_CLUSTER"
    required: true
    enum:
      - BASIC_CLUSTER
      - ENHANCED_CLUSTER

  cni_type:
    type: enum
    title: "CNI Plugin"
    description: |
      Kubernetes networking plugin.
      FLANNEL: overlay networking, pods share worker node IPs (Examples 1 and 2).
      OCI_VCN_IP_NATIVE: pods receive native VCN IPs from a dedicated subnet (Examples 3 and 4).
    default: "OCI_VCN_IP_NATIVE"
    required: true
    enum:
      - OCI_VCN_IP_NATIVE
      - FLANNEL

  is_api_endpoint_public:
    type: boolean
    title: "Public Kubernetes API Endpoint"
    description: |
      When enabled, the API endpoint is placed in a public subnet with a public IP,
      allowing direct access from the internet (Examples 1 and 3).
      When disabled, the API endpoint is placed in a private subnet,
      accessible only within the VCN or via Bastion/VPN (Examples 2 and 4).
    default: true
    required: true

  # ---------------------------------------------------------------------------
  # Network Configuration
  # ---------------------------------------------------------------------------

  vcn_cidr_block_16:
    type: string
    title: "VCN CIDR Block"
    description: "IPv4 CIDR /16 block for the VCN"
    default: "10.0.0.0/16"
    pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/16$"
    required: true

  subnet_lb_cidr_24:
    type: string
    title: "Load Balancer Subnet CIDR"
    description: "Public subnet used by OCI Load Balancers"
    default: "10.0.0.0/24"
    pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/24$"
    required: true

  subnet_api_endpoint_cidr:
    type: string
    title: "API Endpoint Subnet CIDR"
    description: "Subnet used by the Kubernetes API endpoint. Use /29 for OCI VCN-Native CNI or /30 for Flannel CNI."
    default: "10.0.1.0/29"
    required: true

  subnet_nodes_cidr_24:
    type: string
    title: "Worker Nodes Subnet CIDR"
    description: "Private subnet used by worker nodes"
    default: "10.0.2.0/24"
    pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/24$"
    required: true

  subnet_pods_cidr_19:
    type: string
    title: "Pods Subnet CIDR"
    description: "Private subnet used by Kubernetes native pods. Only required when CNI is OCI VCN-Native."
    default: "10.0.32.0/19"
    pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/19$"
    required: true
    visible: ${cni_type == "OCI_VCN_IP_NATIVE"}

  # ---------------------------------------------------------------------------
  # Node Pool Configuration
  # ---------------------------------------------------------------------------

  pool_size:
    type: number
    title: "Worker Node Count"
    description: "Number of worker nodes in the node pool"
    default: 2
    minimum: 1

  pool_node_shape:
    type: enum
    title: "Node Shape"
    description: "Compute shape used by worker nodes"
    default: "VM.Standard.E6.Flex"
    enum:
      - VM.Standard.E6.Flex
      - VM.Standard.E5.Flex

  ocpus:
    type: number
    title: "Node OCPUs"
    description: "OCPUs per node (only used for Flex shapes)"
    default: 2
    minimum: 1

  memory_in_gbs:
    type: number
    title: "Node Memory (GB)"
    description: "Memory per node in GB"
    default: 16
    minimum: 8

  pool_node_image_id:
    type: string
    title: "Node Image OCID"
    description: "OCID of the image used by OKE worker nodes (Oracle Linux 8.x). Documentation: https://docs.oracle.com/en-us/iaas/images/oke-worker-node-oracle-linux-8x/index.htm"
    required: true
